name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Check out pinned upstream encoder for integration test
        uses: actions/checkout@v4
        with:
          repository: XLearning-SCU/2022-CVPR-AirNet
          ref: bedea82f7f7a71f135bcc026fd02ea9f2feaa710
          path: third_party/AirNet
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
      - name: Test equations, modules, data protocol, and upstream encoder
        run: python -m pytest -q --junitxml=runs/junit.xml
      - name: Exercise the synthetic pipeline
        run: python -m spatial_sharing smoke --output runs/smoke
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpu-reports-py${{ matrix.python }}
          path: |
            runs/junit.xml
            runs/smoke/smoke_report.json
          if-no-files-found: ignore
